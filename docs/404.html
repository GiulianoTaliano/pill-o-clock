<style>
:root{
  --paper:#f1f6fd; --ink:#0e1a2d; --body:#3a4761; --muted:#5a6880;
  --blue:#2f7de1; --blue-deep:#1a5cb0; --rule:#d3e0f2;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif;
  --sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:var(--sans);font-size:18px;line-height:1.62;color:var(--body);
  background:var(--paper) url("img/pattern.svg") 0 0/128px 128px;
  min-height:100vh;display:flex;align-items:center;justify-content:center;
  padding:2rem 1.5rem;text-align:center;-webkit-font-smoothing:antialiased;
}
.card{max-width:34em}
.brand{display:inline-flex;align-items:center;gap:.6rem;text-decoration:none;color:var(--ink);
  font-family:var(--serif);font-size:1.22rem;font-weight:600;letter-spacing:-.02em;margin-bottom:2.5rem}
h1{font-family:var(--serif);color:var(--ink);font-size:clamp(1.9rem,1.4rem + 2vw,2.8rem);
  font-weight:600;letter-spacing:-.025em;line-height:1.12;margin-bottom:.9rem}
p{margin-bottom:1.8rem}
.btn{display:inline-flex;align-items:center;font:inherit;font-weight:650;
  padding:.85rem 1.5rem;border-radius:3px;text-decoration:none;
  background:var(--ink);color:var(--paper);border:1.5px solid transparent}
.btn:hover{background:var(--blue-deep)}
.alt{display:block;margin-top:1.3rem;font-size:.9rem;color:var(--muted)}
.alt a{color:var(--blue-deep)}
:focus-visible{outline:2.5px solid var(--blue);outline-offset:3px;border-radius:4px}
</style>
</head>
<body>
  <div class="card">
    <a class="brand" href="/pill-o-clock/">
      <svg width="30" height="30" viewBox="0 0 48 48" aria-hidden="true">
        <defs><clipPath id="m"><rect x="7" y="16" width="34" height="16" rx="8" transform="rotate(45 24 24)"/></clipPath></defs>
        <g clip-path="url(#m)">
          <rect x="5" y="13" width="18.6" height="22" fill="#2f7de1" transform="rotate(45 24 24)"/>
          <rect x="24.4" y="13" width="18.6" height="22" fill="#0e1a2d" transform="rotate(45 24 24)"/>
        </g>
        <g stroke="#0e1a2d" stroke-linecap="round" fill="none">
          <path d="M18.3 18.3 L18.3 12.6" stroke-width="2.9"/>

    <span class="alt">¿Buscabas la <a href="/pill-o-clock/privacy-policy.html">política de privacidad</a>?</span>
  </div>
